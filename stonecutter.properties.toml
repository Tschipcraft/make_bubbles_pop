loomx.loom_version = "1.16-SNAPSHOT"

mod.id = "make_bubbles_pop"
mod.name = "Make Bubbles Pop"
mod.group = "net.tschipcraft"
mod.version = "0.4.0"
mod.channel_tag = "-beta.2"
mod.description = "This client-side mod makes bubble particles pop and completely overhauls their behavior to make them rise realistically to the water surface. It also adds bubble particles to opening chests, opening barrels and explosions underwater."
mod.authors = ["Tschipcraft"]
mod.contributors = ["AViewFromTheTop", "Merhaf", "Mykytius"]
mod.inception_year = "2022"
mod.license.name = "Custom"
mod.license.url = "https://github.com/Tschipcraft/make_bubbles_pop/blob/master/LICENSE"
mod.license.dist = "repo"
mod.sources_url = "https://github.com/Tschipcraft/make_bubbles_pop"
mod.homepage_url = "https://modrinth.com/mod/gPCdW0Wr"
mod.issues_url = "https://github.com/Tschipcraft/make_bubbles_pop/issues"
mod.environment = "client"
mod.icon = "icon.png"
# Points Forge/NeoForge in-game update checks at the Modrinth API. Publishing credentials and
# project ids come from the environment instead, see .env.template.
mod.modrinth_id = "gPCdW0Wr"

# Extra links surfaced in the Mod Menu mod entry.
[mod.links]
"modmenu.donate" = "https://ko-fi.com/tschipcraft"
"modmenu.modrinth" = "https://modrinth.com/mod/gPCdW0Wr"
"modmenu.curseforge" = "https://www.curseforge.com/minecraft/mc-mods/make-bubbles-pop"
"modmenu.youtube" = "https://www.youtube.com/@tschipcraft"

[[mod.pom.developers]]
id = "tschipcraft"
name = "Tschipcraft"
url = "https://github.com/Tschipcraft"

